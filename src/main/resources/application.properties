# Name shown for this application in the log output.
spring.application.name=job-mailer

# Run as a command-line application: do not start a web server.
spring.main.web-application-type=none

# ---------------------------------------------------------------------------
# SMTP (Gmail)
#
# Credentials use the form ${ENV_VARIABLE:<PLACEHOLDER>}: the environment variable
# is used when it is set; otherwise the placeholder stays and must be replaced.
# Put real values in environment variables or in application-local.properties
# (git-ignored). Never commit real credentials.
# ---------------------------------------------------------------------------

# Outgoing mail server (Gmail). Change this to use another provider.
spring.mail.host=smtp.gmail.com

# Port for authenticated, encrypted sending (STARTTLS).
spring.mail.port=587

# Account used to log in to the mail server: your full Gmail address.
spring.mail.username=${MAIL_USERNAME:<FROM_EMAIL_ADDRESS>}

# Gmail App Password: 16 characters, no spaces. Not your normal Gmail password.
spring.mail.password=${MAIL_PASSWORD:<16_CHARACTER_APP_PASSWORD>}

# Log in with the username and password before sending.
spring.mail.properties.mail.smtp.auth=true

# Encrypt the connection before the password is sent.
spring.mail.properties.mail.smtp.starttls.enable=true

# Give up if the connection to the server is not made within this time (milliseconds).
spring.mail.properties.mail.smtp.connectiontimeout=10000

# Give up if the server does not answer within this time (milliseconds).
spring.mail.properties.mail.smtp.timeout=10000

# ---------------------------------------------------------------------------
# Application settings
#
# jobmailer.mode is not set in this file. Pass it on the command line:
#   --jobmailer.mode=enrich | approve | send
# Without it the application starts and does nothing.
# ---------------------------------------------------------------------------

# Your full name: shown as the sender name and available in the template as {{senderName}}.
jobmailer.sender-name=<SENDER_NAME>

# Address the emails are sent from, usually the same as spring.mail.username ({{senderEmail}}).
jobmailer.sender-email=${MAIL_USERNAME:<FROM_EMAIL_ADDRESS>}

# Phone number shown in the email signature ({{senderContact}}).
jobmailer.sender-contact=${SENDER_CONTACT:<CONTACT_NUMBER>}

# LinkedIn profile URL shown in the email signature ({{senderLinkedIn}}).
jobmailer.sender-linked-in=${SENDER_LINKEDIN:<LINKEDIN_URL>}

# Resume PDF attached to every email. Recipients see its file name, so name it professionally.
jobmailer.resume-path=data/resume.pdf

# CSV list of target companies (required columns: company, email; see samples/companies.sample.csv).
jobmailer.companies-path=data/companies.csv

# Record of sent and failed emails; prevents duplicate sends and enforces the daily limit.
jobmailer.sent-log-path=data/sent-log.csv

# Maximum number of real emails per calendar day, counted across runs (allowed range: 1 to 200).
jobmailer.daily-limit=25

# Seconds to wait between two real emails (minimum: 10).
jobmailer.delay-seconds=45

# true: emails are only printed to the log and nothing is sent. Use --jobmailer.dry-run=false for a real send.
jobmailer.dry-run=true
