spring.application.name=job-mailer

spring.main.web-application-type=none

# SMTP (credentials come from environment variables, never from this file)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=<FROM_EMAIL_ADDRESS>
spring.mail.password=<16_DIGIT_CODE_FROM_GMAIL_SECURITY_CODE>
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000

# Application settings
jobmailer.sender-name=<SENDER_NAME>
jobmailer.sender-email=<FROM_EMAIL_ADDRESS>
jobmailer.sender-contact=<CONTACT_NUMBWE>
jobmailer.sender-linked-in=<LINKEDIN_URL>
jobmailer.resume-path=data/<RESUME.pdf>
jobmailer.companies-path=data/<COMPANY_EMAIL_LIST.csv>
jobmailer.sent-log-path=data/sent-log.csv
jobmailer.daily-limit=100
jobmailer.delay-seconds=20
jobmailer.dry-run=true



